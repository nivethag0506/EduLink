services:
  - type: web
    name: campusbridge-backend
    env: node
    rootDir: CampusBridge/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # You must set this manually in the Render dashboard!
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure secret for you
      - key: CLIENT_URL
        sync: false # Set this to your frontend URL after deploying the frontend
